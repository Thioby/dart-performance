name: flutter_bench
description: >-
  Benchmark "fetch 10k users as JSON and filter them" on a device:
  the same variants as the CLI (packages/users_pipeline), plus a jank frame
  counter showing what happens to the UI when you parse on the main thread.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  users_pipeline:
    path: ../packages/users_pipeline

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
