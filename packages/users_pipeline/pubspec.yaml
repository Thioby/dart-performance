name: users_pipeline
description: >-
  Realistic benchmark "fetch 10k users as JSON, decode, filter, sort,
  encode" in four variants: from idiomatic (http + jsonDecode + fromJson +
  where/map/toList) to a columnar byte parser with no intermediate tree.
  Pure Dart; used by the CLI (benchmarks/) and the Flutter app
  (flutter_bench/).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
